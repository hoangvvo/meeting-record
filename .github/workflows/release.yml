name: Release
run-name: Release ${{ inputs.package }} (publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to prepare
        required: true
        type: choice
        options:
          - all
          - node
          - rust
      publish:
        description: Publish after every selected package passes verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-prebuild:
    name: Node.js prebuild (${{ matrix.target }})
    if: ${{ inputs.package == 'all' || inputs.package == 'node' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-arm64
            runner: windows-11-arm
          - target: win32-x64
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Node-API prebuild
        run: npm run build:prebuild --workspace meeting-record

      - name: Verify Node-API prebuild
        env:
          PREBUILD_PATH: node/prebuilds/${{ matrix.target }}/meeting-record.node
        run: node -e 'const fs = require("node:fs"); const file = process.env.PREBUILD_PATH; if (!fs.existsSync(file)) throw new Error("missing " + file);'

      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-prebuild-${{ matrix.target }}
          path: node/prebuilds/
          if-no-files-found: error
          retention-days: 3

  package-npm:
    name: Package npm tarball
    needs: node-prebuild
    if: ${{ inputs.package == 'all' || inputs.package == 'node' }}
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: node-prebuild-*
          path: node/prebuilds
          merge-multiple: true

      - name: Verify complete prebuild set
        run: |
          targets=(darwin-arm64 darwin-x64 win32-arm64 win32-x64)
          for target in "${targets[@]}"; do
            test -f "node/prebuilds/$target/meeting-record.node"
          done
          file_count="$(find node/prebuilds -type f | wc -l | tr -d ' ')"
          test "$file_count" = "${#targets[@]}"

      - name: Pack npm package
        run: |
          mkdir -p package-artifacts
          npm pack --workspace meeting-record --pack-destination package-artifacts

      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  package-crate:
    name: Package Rust crate
    if: ${{ inputs.package == 'all' || inputs.package == 'rust' }}
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable

      - name: Stage bundled native sources
        shell: bash
        run: |
          ./scripts/stage-rust-package.sh
          for directory in include macos windows; do
            diff -qr "native/$directory" "rust/native/$directory"
          done

      - name: Package Rust crate
        run: cargo package --allow-dirty --locked -p meeting-record
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.2"

      - name: Upload Rust crate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-crate
          path: target/package/meeting-record-*.crate
          if-no-files-found: error
          retention-days: 7

  release-ready:
    name: Verify selected release artifacts
    needs:
      - package-npm
      - package-crate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SELECTED_PACKAGE: ${{ inputs.package }}
      NODE_RESULT: ${{ needs.package-npm.result }}
      RUST_RESULT: ${{ needs.package-crate.result }}

    steps:
      - name: Check selected package results
        run: |
          case "$SELECTED_PACKAGE" in
            node)
              test "$NODE_RESULT" = success
              ;;
            rust)
              test "$RUST_RESULT" = success
              ;;
            all)
              test "$NODE_RESULT" = success
              test "$RUST_RESULT" = success
              ;;
          esac

  publish-npm:
    name: Publish to npm
    needs:
      - package-npm
      - release-ready
    if: ${{ inputs.publish && (inputs.package == 'all' || inputs.package == 'node') }}
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Download npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifacts

      - name: Publish to npm
        run: npm publish package-artifacts/*.tgz

  publish-crates:
    name: Publish to crates.io
    needs:
      - package-crate
      - release-ready
    if: ${{ inputs.publish && (inputs.package == 'all' || inputs.package == 'rust') }}
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable

      - name: Stage bundled native sources
        shell: bash
        run: |
          ./scripts/stage-rust-package.sh
          for directory in include macos windows; do
            diff -qr "native/$directory" "rust/native/$directory"
          done

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish --allow-dirty --locked -p meeting-record
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          MACOSX_DEPLOYMENT_TARGET: "14.2"
