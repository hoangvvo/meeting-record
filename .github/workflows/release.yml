name: Release
run-name: Release ${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - all
          - node
          - rust

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-prebuild:
    name: Node.js prebuild (${{ matrix.name }})
    if: inputs.package == 'all' || inputs.package == 'node'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
          - name: darwin-x64
            runner: macos-15-intel
          - name: win32-arm64
            runner: windows-11-arm
          - name: win32-x64
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Node-API prebuild
        run: npm run build:prebuild --workspace meeting-record

      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-prebuild-${{ matrix.name }}
          path: node/prebuilds/
          if-no-files-found: error
          retention-days: 3

  publish-npm:
    name: Publish to npm
    needs: node-prebuild
    if: inputs.package == 'all' || inputs.package == 'node'
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: node-prebuild-*
          path: node/prebuilds
          merge-multiple: true

      - name: Pack npm package
        run: |
          mkdir -p package-artifacts
          npm pack --workspace meeting-record --pack-destination package-artifacts

      - name: Smoke-test packed npm package
        run: |
          package="$(find "$GITHUB_WORKSPACE/package-artifacts" -name '*.tgz' -print -quit)"
          test_dir="$(mktemp -d)"
          cd "$test_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$package" >/dev/null
          node --input-type=module -e "import('meeting-record').then(m => console.log(Object.keys(m)))"

      - name: Publish to npm
        run: npm publish package-artifacts/*.tgz

  publish-crates:
    name: Publish to crates.io
    if: inputs.package == 'all' || inputs.package == 'rust'
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable

      - name: Stage bundled native sources
        run: ./scripts/stage-rust-package.sh

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish --locked -p meeting-record
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          MACOSX_DEPLOYMENT_TARGET: "14.2"
