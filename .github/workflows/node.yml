name: Node CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/node.yml"
      - ".github/workflows/release.yml"
      - "native/**"
      - "node/**"
      - "scripts/build-macos.sh"
      - "scripts/build-native.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/node.yml"
      - ".github/workflows/release.yml"
      - "native/**"
      - "node/**"
      - "scripts/build-macos.sh"
      - "scripts/build-native.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            prebuild: darwin-arm64
          - name: macOS x86-64
            runner: macos-15-intel
            prebuild: darwin-x64
          - name: Windows arm64
            runner: windows-11-arm
            prebuild: win32-arm64
          - name: Windows x86-64
            runner: windows-2025
            prebuild: win32-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Build Node-API prebuild
        run: npm run build:prebuild --workspace meeting-record

      - name: Build TypeScript package
        run: npm run build:ts --workspace meeting-record

      - name: Test Node-API prebuild
        env:
          PREBUILD_PATH: node/prebuilds/${{ matrix.prebuild }}/meeting-record.node
        run: |
          node -e 'const fs = require("node:fs"); const file = process.env.PREBUILD_PATH; if (!fs.existsSync(file)) throw new Error("missing " + file); fs.rmSync("node/build", { recursive: true, force: true });'
          npm test --workspace meeting-record
