name: Node CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/node.yml"
      - ".github/workflows/release.yml"
      - "native/**"
      - "node/**"
      - "scripts/build-macos.sh"
      - "scripts/build-native.mjs"
      - "scripts/build-prebuild.mjs"
      - "scripts/test-linux.sh"
      - "e2e/linux*"
      - "scripts/test-windows.ps1"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/node.yml"
      - ".github/workflows/release.yml"
      - "native/**"
      - "node/**"
      - "scripts/build-macos.sh"
      - "scripts/build-native.mjs"
      - "scripts/build-prebuild.mjs"
      - "scripts/test-linux.sh"
      - "e2e/linux*"
      - "scripts/test-windows.ps1"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux native and live audio (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            firefox_os: linux64
            geckodriver_arch: linux64
          - arch: arm64
            runner: ubuntu-24.04-arm
            firefox_os: linux64-aarch64
            geckodriver_arch: linux-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libpulse-dev libatspi2.0-dev at-spi2-core pulseaudio pulseaudio-utils pipewire pipewire-pulse wireplumber dbus-x11 xvfb weston libgtk-3-0t64 libasound2t64 libdbus-glib-1-2

      - name: Ensure Chrome is installed
        if: matrix.arch == 'x64'
        run: |
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$RUNNER_TEMP/chrome.deb"
            sudo apt-get install -y "$RUNNER_TEMP/chrome.deb"
          fi

      - name: Install Firefox and geckodriver
        run: |
          curl -fsSL 'https://download.mozilla.org/?product=firefox-latest-ssl&os=${{ matrix.firefox_os }}&lang=en-US' -o "$RUNNER_TEMP/firefox.tar.xz"
          tar -xf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          curl -fsSL 'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-${{ matrix.geckodriver_arch }}.tar.gz' -o "$RUNNER_TEMP/geckodriver.tar.gz"
          tar -xf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP"

      - name: Lint
        run: npm run lint

      - name: Build native and TypeScript package
        run: npm run build --workspace meeting-record

      - name: Test JavaScript API
        run: npm test --workspace meeting-record

      - name: Test real audio servers
        env:
          MREC_RUST_E2E: ${{ github.workspace }}/target/debug/examples/linux_e2e
          MREC_STRESS_SECONDS: 60
        run: |
          cargo build --locked -p meeting-record --example linux_e2e
          bash e2e/linux.sh pulse
          bash e2e/linux.sh pipewire

      - name: Test Chrome WebRTC on X11 and Wayland
        if: matrix.arch == 'x64'
        env:
          CHROME: google-chrome
        run: |
          bash e2e/linux-browser.sh x11
          bash e2e/linux-browser.sh wayland

      - name: Test Firefox WebRTC on X11 and Wayland
        env:
          MREC_BROWSER: firefox
          FIREFOX: ${{ runner.temp }}/firefox/firefox
          GECKODRIVER: ${{ runner.temp }}/geckodriver
        run: |
          bash e2e/linux-browser.sh x11
          bash e2e/linux-browser.sh wayland

      - name: Save Linux test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-e2e-${{ matrix.arch }}
          path: native/build/linux/artifacts/
          if-no-files-found: ignore

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            prebuild: darwin-arm64
          - name: macOS x86-64
            runner: macos-15-intel
            prebuild: darwin-x64
          - name: Windows arm64
            runner: windows-11-arm
            prebuild: win32-arm64
          - name: Windows x86-64
            runner: windows-2025
            prebuild: win32-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Build Node-API prebuild
        run: npm run build:prebuild --workspace meeting-record

      - name: Test native core
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1

      - name: Build TypeScript package
        run: npm run build:ts --workspace meeting-record

      - name: Test Node-API prebuild
        env:
          PREBUILD_PATH: node/prebuilds/${{ matrix.prebuild }}/meeting-record.node
        run: |
          node -e 'const fs = require("node:fs"); const file = process.env.PREBUILD_PATH; if (!fs.existsSync(file)) throw new Error("missing " + file); fs.rmSync("node/build", { recursive: true, force: true });'
          npm test --workspace meeting-record
