name: Live audio E2E

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Run Windows system and process capture
        type: boolean
        default: true
      windows_binding:
        description: Windows bindings to exercise
        type: choice
        options:
          - All
          - Rust
          - Node
        default: All
      macos:
        description: Run macOS system capture
        type: boolean
        default: false
      microphone:
        description: Require a non-silent microphone track
        type: boolean
        default: false
      windows_microphone_device:
        description: Windows output device that loops back to the default microphone, such as CABLE Input
        type: string
        default: ""
      windows_switch_microphone:
        description: Windows recording device to switch the default microphone to mid-capture
        type: string
        default: ""
      duration_seconds:
        description: Capture duration for each test
        type: string
        default: "8"

permissions:
  contents: read

concurrency:
  group: live-audio-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: inputs.windows
    runs-on: [self-hosted, Windows, meeting-record-audio]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable

      - name: Set up Node.js
        if: inputs.windows_binding != 'Rust'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Node.js dependencies
        if: inputs.windows_binding != 'Rust'
        run: npm ci --ignore-scripts

      - name: Run live Windows capture
        shell: pwsh
        env:
          E2E_BINDING: ${{ inputs.windows_binding }}
          E2E_DURATION: ${{ inputs.duration_seconds }}
          E2E_MICROPHONE: ${{ inputs.microphone }}
          E2E_MICROPHONE_DEVICE: ${{ inputs.windows_microphone_device }}
          E2E_SWITCH_MICROPHONE: ${{ inputs.windows_switch_microphone }}
        run: |
          $options = @{
            Mode = "All"
            Binding = $env:E2E_BINDING
            DurationSeconds = [int]$env:E2E_DURATION
          }
          if ($env:E2E_MICROPHONE -eq "true") {
            $options.Microphone = $true
          }
          if ($env:E2E_MICROPHONE_DEVICE) {
            $options.MicrophoneDevice = $env:E2E_MICROPHONE_DEVICE
          }
          if ($env:E2E_SWITCH_MICROPHONE) {
            $options.SwitchMicrophone = $env:E2E_SWITCH_MICROPHONE
          }
          ./e2e/windows.ps1 @options

  macos:
    if: inputs.macos
    runs-on: [self-hosted, macOS, meeting-record-audio]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run live macOS capture
        env:
          MREC_DURATION_SECONDS: ${{ inputs.duration_seconds }}
          MREC_IDENTITY: ${{ secrets.MREC_E2E_MACOS_SIGNING_IDENTITY }}
          MREC_TEST_MICROPHONE: ${{ inputs.microphone && '1' || '' }}
        run: ./e2e/macos.sh
