name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
      - "native/**"
      - "rust/**"
      - "scripts/stage-rust-package.sh"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
      - "native/**"
      - "rust/**"
      - "scripts/stage-rust-package.sh"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
          - name: macOS x86-64
            runner: macos-15-intel
          - name: Windows arm64
            runner: windows-11-arm
          - name: Windows x86-64
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Test Rust package
        run: cargo test --locked -p meeting-record
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.2"

      - name: Stage bundled native sources
        shell: bash
        run: |
          ./scripts/stage-rust-package.sh
          for directory in include macos windows; do
            diff -qr "native/$directory" "rust/native/$directory"
          done

      - name: Verify packaged Rust crate
        run: cargo package --allow-dirty --locked -p meeting-record
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.2"
